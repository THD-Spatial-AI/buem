[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "buem"
dynamic = ["version"]
description = "Building energy model for analysis of hourly thermal load(ISO 52019-1:2017, 5R1C)"
authors = [
    { name="Somadutta Sahoo", email="s.sahoo@uu.nl" }
]
readme = "README.md"
license = {text = "MIT License"}
requires-python = ">=3.14"
keywords = [
    "building",
    "energy-model",
    "energy-communities",
    "parameterization",
    "open-source",
    "heating-cooling",
    "python",
]
classifiers = [
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "cvxpy",
    "dask[array]",  # required at runtime by weather's xr.open_mfdataset point-query path; not declared by weather[pointquery] itself
    "flask",
    "flask-swagger-ui",
    "joblib",
    "jsonschema",
    "marshmallow>=4.0.0",
    "marshmallow-dataclass>=8.0.0",
    "matplotlib",
    "numba",
    "numpy",
    "openpyxl",
    "pandas",
    "psutil",
    "psycopg2",
    "pulp",
    "pvlib",
    "pyarrow",
    "python-dotenv",
    "requests",  # weather_cache.py's optional remote (WEATHER_API_URL) fetch backend
    "scipy",
    # weather: https://github.com/UU-BUEM/weather -- compulsory (2026-08-03): all
    # solar/T/GHI/DHI/DNI attributes come from this package's real per-location
    # fetch, no bundled/local-file fallback. Not on PyPI/conda yet, so a direct
    # git reference (PEP 508), tracked at @main -- see infrastructure/env/
    # buem_env.yml's header comment for the reproducibility trade-off.
    "weather[pointquery,solar] @ git+https://github.com/UU-BUEM/weather.git@main",
    # occupancy: https://github.com/UU-BUEM/occupancy -- compulsory (2026-08-07):
    # all Q_ig/elecLoad/occ_nothome/occ_sleeping attributes come from this
    # package's real HouseholdProfile/ServiceBuildingProfile generation, no
    # synthetic fallback. Not on PyPI/conda yet, so a direct git reference
    # (PEP 508), tracked at @main -- see infrastructure/env/buem_env.yml's
    # header comment for the reproducibility trade-off.
    "occupancy @ git+https://github.com/UU-BUEM/occupancy.git@main",
]

[project.optional-dependencies]
server = [
    "gunicorn",
]
docs = [
    "sphinx>=9.0.0",
    "sphinx-rtd-theme>=3.0.0",
]
dev = [
    "mypy",
    "pytest",
    "pytest-cov",
    "ruff",
]

[project.scripts]
buem = "buem.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
buem = [
    "apis/openapi.yaml",
    "data/**/*",
    "softwares/**/*",
    "integration/json_schema/**/*",
]

[tool.setuptools_scm]
version_file = "src/buem/_version.py"
fallback_version = "1.2.0"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
extend-ignore = [
    "E203", "E501",
    "RUF100",  # some `# noqa: E402` comments target flake8 (this repo's IDE linter),
               # not ruff -- ruff doesn't select E402 itself, so it would otherwise
               # flag those as "unused noqa" and fail on a rule flake8 still enforces.
]

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# run_test.py is a standalone manual smoke script (no test_ functions/asserts,
# prints results) that happens to match pytest's default *_test.py collection
# glob and runs ModelBUEM.sim_model() at import time -- a failure there aborts
# collection for the entire suite rather than just itself. Run it directly
# (`python tests/run_test.py`) when needed instead of via pytest.
addopts = "--ignore=tests/run_test.py"
