# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

formats: all

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

sphinx:
  configuration: docs/source/conf.py

# Sphinx + theme only -- buem itself is deliberately NOT installed.
#
# The documentation is hand-written prose with no autodoc directives, so
# nothing here imports buem. Installing it would break the build twice
# over: pip would refuse on Python < 3.14 (`requires-python = ">=3.14"`),
# and buem's compulsory `weather` dependency fetches real reanalysis
# archives at import time, which no docs builder has. `conf.py` falls back
# to reading the version out of pyproject.toml when buem is absent.
python:
  install:
  - requirements: docs/requirements.txt