name: buem_env
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.14
  # Core scientific
  - coincbc
  - cvxpy
  - flask
  - flask-swagger-ui
  - joblib
  - jsonschema
  - matplotlib
  - numba
  - numpy
  - openpyxl
  - pandas
  - psutil
  - psycopg2
  - pulp
  - pvlib
  - pyarrow
  - python-dotenv
  - scipy
  - setuptools-scm>=8
  # Development
  - mypy
  - pytest
  - pytest-cov
  - ruff
  - pip
  - pip:
    - marshmallow>=4.0.0
    - marshmallow-dataclass>=8.0.0
