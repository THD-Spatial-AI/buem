name: CI

"on":
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          auto-activate: false
          channels: conda-forge,defaults
          activate-environment: buem_env
          environment-file: infrastructure/env/buem_env.yml
          python-version: "3.14"

      - name: Install package
        shell: bash -l {0}
        run: pip install -e . --no-deps

      - name: Lint
        shell: bash -l {0}
        run: ruff check src/ tests/

      - name: Type check
        shell: bash -l {0}
        run: mypy src

      - name: Test with coverage
        shell: bash -l {0}
        run: pytest -q --cov=buem --cov-report=xml

      - name: Smoke test CLI
        shell: bash -l {0}
        run: buem validate

      - name: Upload coverage
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
